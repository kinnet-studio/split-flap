<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>split-flap examples</title>
        <style>
            body {
                margin: 0;
                padding: 24px;
                background: #1b1b1f;
                color: #eeeeee;
                font-family: system-ui, sans-serif;
            }
            section {
                margin-bottom: 40px;
            }
            h2 {
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #a8a8b0;
            }
            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin: 8px 0 16px;
            }
            button,
            input,
            select {
                background: #2c2c33;
                color: #eeeeee;
                border: 1px solid #44444c;
                border-radius: 6px;
                padding: 6px 12px;
                font: inherit;
            }
            button {
                cursor: pointer;
            }
            .boards {
                display: flex;
                flex-wrap: wrap;
                gap: 24px;
                align-items: flex-start;
            }
            canvas {
                display: block;
                max-width: 100%;
            }
        </style>
    </head>
    <body>
        <nav class="controls">
            <a href="./react.html">React adapter demo</a>
            <a href="./vue.html">Vue adapter demo</a>
        </nav>
        <section>
            <h2>Departures: Canvas 2D (left), Pixi (right), one board</h2>
            <div class="controls">
                <button id="next">Next message</button>
                <button id="play">Play playlist</button>
                <button id="spin">Spin</button>
                <button id="stop">Stop</button>
                <button id="sound">Sound: off</button>
                <select id="sound-source" aria-label="Sound">
                    <option value="recorded" selected>
                        Sound: recorded flaps
                    </option>
                    <option value="synth">Sound: synth</option>
                </select>
                <select id="theme" aria-label="Theme">
                    <option value="classic">Theme: classic</option>
                    <option value="solari">Theme: solari</option>
                    <option value="airport">Theme: airport</option>
                    <option value="cream">Theme: cream</option>
                </select>
                <select id="finish" aria-label="Finish">
                    <option value="matte" selected>Finish: matte</option>
                    <option value="satin">Finish: satin</option>
                    <option value="gloss">Finish: gloss</option>
                </select>
            </div>
            <div class="boards">
                <canvas id="departures-canvas"></canvas>
                <div id="departures-pixi"></div>
            </div>
        </section>
        <section>
            <h2>Plain grid</h2>
            <div class="controls">
                <input id="grid-input" value="HELLO WORLD" maxlength="22" />
                <button id="grid-show">Show</button>
            </div>
            <!-- The grid fits this wrapper: resize the window to see it scale. -->
            <div id="grid-wrap" style="max-width: 720px">
                <canvas id="grid-canvas"></canvas>
            </div>
        </section>
        <section>
            <h2>Colour flaps (shortest path)</h2>
            <canvas id="colors-canvas"></canvas>
        </section>
        <section>
            <h2>One picture across many units</h2>
            <div class="controls">
                <button id="icon-plane">Plane</button>
                <button id="icon-arrow">Arrow</button>
                <button id="icon-heart">Heart</button>
                <button id="icon-sun">Sun</button>
                <button id="icons-play">Play all</button>
            </div>
            <canvas id="icons-canvas"></canvas>
        </section>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
